# استقرار Production (Cloud یا On-Premise):
#   docker compose -f docker-compose.deploy.yml up -d --build
# متغیرها را قبل از اجرا در .env یا محیط ست کنید: POSTGRES_PASSWORD

services:
  postgres:
    image: postgres:16
    container_name: crm-db
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Crm.Web/Dockerfile
    container_name: crm-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=crm;Username=crm;Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    volumes:
      - crm_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Backup خودکار روزانه Postgres — خروجی در ولوم crm_backups (۱۴ نسخه آخر)
  backup:
    image: postgres:16
    container_name: crm-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - crm_backups:/backups
    entrypoint: >
      bash -c 'while true; do
        pg_dump -h postgres -U crm -d crm -F c -f "/backups/crm-$$(date +%Y%m%d-%H%M).dump" &&
        ls -1t /backups/crm-*.dump 2>/dev/null | tail -n +15 | xargs -r rm --;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crm_pgdata:
  crm_uploads:
  crm_backups:
